[project]
name = "kids-english-studio"
version = "0.1.0"
description = "一句话 → 自动产出一支幼儿英语定格动画短视频 (KES)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "jsonschema>=4.20",
]

[project.scripts]
kes = "kes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kes"]
