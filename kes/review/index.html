<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KES 本地审片台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141820;color:#e9edf5;font:14px system-ui,-apple-system,sans-serif}
button,textarea{font:inherit}button{border:1px solid #566077;border-radius:6px;background:#293448;color:white;padding:7px 10px;cursor:pointer}
button:hover{background:#3c4d69}button:disabled{opacity:.45;cursor:not-allowed}
header{display:flex;align-items:center;gap:9px;padding:10px 15px;background:#202838;border-bottom:1px solid #394458}
header h1{font-size:16px;margin:0 auto 0 0}#statusBadge{color:#b7d7ff;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;height:calc(100vh - 57px)}
.work{display:flex;flex-direction:column;min-width:0;min-height:0}
.player{flex:1;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080a0e;position:relative}
#videoPlayer{width:100%;height:calc(100% - 50px);object-fit:contain}
#videoMessage{position:absolute;top:40%;color:#ffd08a}
.transport{height:50px;display:flex;align-items:center;gap:10px;padding:0 14px;width:100%;color:#d9e6f7}
#position{margin-left:auto;font-variant-numeric:tabular-nums}
.film{flex:none;height:130px;display:flex;gap:6px;overflow-x:auto;padding:9px;background:#202838;border-top:1px solid #394458}
.shot{flex:none;width:130px;height:109px;background:#30394b;border:2px solid transparent;border-radius:6px;position:relative;overflow:hidden;cursor:pointer}
.shot.active{border-color:#7fb4ff}.shot img{width:100%;height:75px;object-fit:contain;background:#080a0e}
.shot .label{padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.pin{position:absolute;right:2px;top:2px;background:#202838d9;border-radius:9px;padding:2px}
aside{border-left:1px solid #394458;display:flex;flex-direction:column;min-height:0;background:#202838}
.aside-head{padding:13px;border-bottom:1px solid #394458;font-weight:bold}
#commentsList{flex:1;overflow-y:auto;padding:10px}
.comment{background:#293448;border-left:3px solid #7fb4ff;border-radius:4px;padding:9px;margin-bottom:9px}
.meta{color:#b7c4d8;font-size:12px;cursor:pointer}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}
.reply{color:#bfe0c1;font-size:12px}.actions{display:flex;gap:6px;margin-top:7px}
.actions button{font-size:12px;padding:4px 7px}
.input{padding:10px;border-top:1px solid #394458;display:grid;gap:7px}
textarea{width:100%;resize:vertical;min-height:68px;border-radius:5px;border:1px solid #566077;background:#141820;color:white;padding:7px}
#notice{min-height:19px;color:#ffd08a;font-size:12px}
@media(max-width:700px){header{flex-wrap:wrap}.layout{display:flex;flex-direction:column;height:calc(100vh - 100px)}.work{height:60%;min-height:300px}aside{height:40%;border-left:0;border-top:1px solid #394458}}
</style>
</head>
<body>
<header>
 <h1>KES 本地审片台</h1><span id="statusBadge">加载中</span>
 <button id="refreshBtn">刷新</button><button id="submitBtn">提交给 agent</button>
 <button id="approveBtn">通过</button><button id="copyBtn">复制意见</button>
</header>
<div class="layout">
 <div class="work">
  <div class="player">
   <video id="videoPlayer" controls preload="metadata" src="/video"></video>
   <div id="videoMessage"></div>
   <div class="transport"><button id="prevFrame" title="上一帧">←</button><button id="playPause" title="播放/暂停">播放</button><button id="nextFrame" title="下一帧">→</button><span id="position">00:00:00:00 · 帧 0 · -</span></div>
  </div>
  <div id="timeline" class="film" aria-label="镜头时间轴"></div>
 </div>
 <aside>
  <div class="aside-head">意见（<span id="commentCount">0</span>）</div>
  <div id="commentsList"></div>
  <div class="input"><textarea id="commentText" placeholder="在当前帧输入意见；回车添加，Shift+回车换行"></textarea><button id="addBtn">添加当前帧意见</button><div id="notice"></div></div>
 </aside>
</div>
<script>
const offlineData = __OFFLINE_DATA__;
const offline = offlineData !== null;
const video = document.getElementById('videoPlayer');
const $ = id => document.getElementById(id);
let episode = null, timeline = {fps:24,shots:[]}, comments = [];
const fps = () => Number(timeline.fps) || 24;
function notice(message){$('notice').textContent=message}
function frameNow(){return Math.max(0,Math.floor((video.currentTime || 0)*fps()+0.001))}
function shotAt(frame){return timeline.shots.find(s=>frame>=s.start_frame && frame<s.end_frame) || null}
function timecode(frame){let f=fps(), h=Math.floor(frame/(f*3600)),m=Math.floor(frame/(f*60))%60,s=Math.floor(frame/f)%60,ff=frame%f;return [h,m,s,ff].map(n=>String(n).padStart(2,'0')).join(':')}
function position(){
 const frame=frameNow(),shot=shotAt(frame);
 $('position').textContent=timecode(frame)+' · 帧 '+frame+' · '+(shot?shot.cue_id+' / '+(shot.camera||shot.action||'镜头'):'-');
 document.querySelectorAll('.shot').forEach((el,i)=>el.classList.toggle('active',timeline.shots[i]===shot));
 $('playPause').textContent=video.paused?'播放':'暂停';
}
async function api(path,data){
 const options=data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)};
 const response=await fetch(path,options);const result=await response.json();
 if(!response.ok||!result.ok)throw new Error(result.error||'请求失败');
 return result;
}
function cueFor(frame){return shotAt(frame)?.cue_id || null}
function renderComments(){
 $('commentCount').textContent=comments.length;
 const list=$('commentsList');list.replaceChildren();
 for(const c of comments){
  const row=document.createElement('div');row.className='comment';
  const meta=document.createElement('div');meta.className='meta';meta.textContent=timecode(c.frame)+' · 帧 '+c.frame+' · '+(c.cue_id||'-');
  meta.onclick=()=>{video.currentTime=c.frame/fps();position()};row.append(meta);
  const body=document.createElement('div');body.className='body';body.textContent=c.text;row.append(body);
  if(c.agent_reply){const reply=document.createElement('div');reply.className='reply';reply.textContent='Agent：'+c.agent_reply;row.append(reply)}
  const actions=document.createElement('div');actions.className='actions';
  const edit=document.createElement('button');edit.textContent='编辑';edit.onclick=async()=>{
   const text=prompt('修改意见',c.text);if(text===null)return;
   if(!text.trim()){notice('意见不能为空');return}
   try{if(offline)c.text=text.trim();else Object.assign(c,(await api('/api/comments/update',{id:c.id,text})).comment);renderComments()}catch(e){notice(e.message)}
  };
  const del=document.createElement('button');del.textContent='删除';del.onclick=async()=>{
   if(!confirm('删除这条意见？'))return;
   try{if(!offline)await api('/api/comments/delete',{id:c.id});comments=comments.filter(x=>x.id!==c.id);renderComments()}catch(e){notice(e.message)}
  };
  actions.append(edit,del);row.append(actions);list.append(row);
 }
 renderPins();
}
function renderPins(){
 document.querySelectorAll('.shot').forEach((el,i)=>{
  el.querySelector('.pin')?.remove();
  const s=timeline.shots[i];
  if(comments.some(c=>c.frame>=s.start_frame&&c.frame<s.end_frame)){
   const pin=document.createElement('span');pin.className='pin';pin.textContent='📌';el.append(pin);
  }
 });
}
function renderTimeline(){
 const container=$('timeline');container.replaceChildren();
 for(const [i,s] of timeline.shots.entries()){
  const el=document.createElement('div');el.className='shot';el.title='帧 '+s.start_frame+' · '+(s.cue_id||'')+' · '+(s.camera||s.action||'');
  const img=document.createElement('img');img.alt='镜头 '+(i+1)+' 缩略图';el.append(img);
  const label=document.createElement('div');label.className='label';label.textContent=(i+1)+' · '+(s.cue_id||'-')+' · '+(s.camera||s.action||'镜头');el.append(label);
  el.onclick=()=>{video.currentTime=s.start_frame/fps();position()};container.append(el);
 }
 renderPins();captureThumbnails();
}
async function captureThumbnails(){
 if(!timeline.shots.length||!video.src)return;
 const scout=document.createElement('video');scout.muted=true;scout.preload='auto';scout.src=video.src;
 try{
  if(scout.readyState<1)await new Promise((resolve,reject)=>{scout.onloadedmetadata=resolve;scout.onerror=reject});
  const canvas=document.createElement('canvas');canvas.width=160;canvas.height=90;
  for(const [i,s] of timeline.shots.entries()){
   const t=Math.min(Math.max(0,s.start_frame/fps()+0.08),Math.max(0,scout.duration-0.08));
   if(Math.abs(scout.currentTime-t)>.01)await new Promise((resolve,reject)=>{scout.onseeked=resolve;scout.onerror=reject;scout.currentTime=t});
   canvas.getContext('2d').drawImage(scout,0,0,160,90);
   const el=$('timeline').children[i]?.querySelector('img');if(el)el.src=canvas.toDataURL('image/jpeg',.65);
  }
 }catch(e){notice('缩略图暂不可用，仍可按镜头跳转')}finally{scout.removeAttribute('src');scout.load()}
}
async function refresh(){
 if(offline)return;
 try{
  const [cs,st]=await Promise.all([api('/api/comments'),api('/api/status')]);comments=cs.comments;renderComments();setStatus(st.status);
 }catch(e){notice(e.message)}
}
function setStatus(status){
 const labels={waiting:'等待提交',submitted:'agent 处理中',ready:'可刷新看新版',approved:'已通过'};
 $('statusBadge').textContent=(labels[status.status]||status.status)+' · 版本 '+status.version;
}
async function addComment(){
 const text=$('commentText').value.trim();if(!text)return;
 const frame=frameNow(),cue_id=cueFor(frame);
 try{
  const c=offline?{id:'local-'+Date.now(),frame,cue_id,text,agent_reply:null}:(await api('/api/comments',{frame,cue_id,text})).comment;
  comments.push(c);$('commentText').value='';renderComments();
 }catch(e){notice(e.message)}
}
async function decision(path){
 if(!confirm(path==='/api/submit'?'提交意见给 agent？':'确认通过审片？'))return;
 try{await api(path,{});await refresh();notice('已保存；可关闭此页')}catch(e){notice(e.message)}
}
async function copyComments(){
 const text=JSON.stringify(comments,null,2);
 try{await navigator.clipboard.writeText(text);notice('意见 JSON 已复制')}
 catch(e){const box=$('commentText');box.value=text;box.select();document.execCommand('copy');notice('意见 JSON 已放入文本框并尝试复制')}
}
function stepFrame(delta){video.pause();video.currentTime=Math.max(0,Math.min(video.duration||Infinity,(frameNow()+delta)/fps()));position()}
$('prevFrame').onclick=()=>stepFrame(-1);$('nextFrame').onclick=()=>stepFrame(1);
$('playPause').onclick=()=>video.paused?video.play():video.pause();
$('addBtn').onclick=addComment;$('submitBtn').onclick=()=>decision('/api/submit');$('approveBtn').onclick=()=>decision('/api/approve');
$('copyBtn').onclick=copyComments;$('refreshBtn').onclick=()=>location.reload();
$('commentText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addComment()}});
document.addEventListener('keydown',e=>{
 if(['TEXTAREA','INPUT'].includes(document.activeElement?.tagName))return;
 if(e.code==='Space'){e.preventDefault();video.paused?video.play():video.pause()}
 if(e.key==='ArrowLeft'){e.preventDefault();stepFrame(-1)}
 if(e.key==='ArrowRight'){e.preventDefault();stepFrame(1)}
});
video.addEventListener('timeupdate',position);video.addEventListener('seeked',position);
video.addEventListener('play',position);video.addEventListener('pause',position);
async function init(){
 try{
  if(offline){
   episode=offlineData.episode;timeline=offlineData.timeline;comments=offlineData.comments;
   if(offlineData.video)video.src=offlineData.video;else $('videoMessage').textContent='本地视频不存在';
   $('submitBtn').disabled=true;$('approveBtn').disabled=true;setStatus({status:'waiting',version:'离线'});
   notice('离线模式：意见仅保存在此页，使用“复制意见”交给 agent');
  }else{
   const result=await api('/api/episode');episode=result.data;timeline=result.timeline;
   if(!result.video){video.removeAttribute('src');$('videoMessage').textContent='本地视频不存在'}
   await refresh();setInterval(refresh,5000);
  }
  renderTimeline();renderComments();position();
 }catch(e){notice('加载失败：'+e.message)}
}
init();
</script>
</body>
</html>
